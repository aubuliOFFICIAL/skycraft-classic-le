name: Compile native source for review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned PE inspection library
        run: python -m pip install pefile==2024.8.26
      - name: Verify and unpack official compiler
        run: python tools/setup_review_toolchain.py
      - name: Compile only, without game files
        run: python tools/build_bootstrap.py --source-review
      - name: Report compile scope and hash
        run: Get-Content build/source-compile-review.json
